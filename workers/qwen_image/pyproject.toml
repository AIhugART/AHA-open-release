[project]
name = "aha-open-worker-qwen-image"
version = "0.0.1"
description = "AHA open worker: Qwen-Image-2.1 (pinned runtime, own venv)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "diffusers @ git+https://github.com/huggingface/diffusers@80c7ed262aeffbeb43ef13ae04baeb9b84515a69",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "peft==0.22.0",  # LoRA adapters (diffusers' LoRA loader needs it)
  "bitsandbytes==0.50.2",  # the `int8` variant (community bitsandbytes build); the ConvRot variants do not use it
  "comfy-kitchen==0.2.42",  # Apache-2.0: the ConvRot kernels the ConvRot variants build on; not ComfyUI
  "huggingface-hub==1.32.0",
  "tokenizers==0.23.2",
  "safetensors==0.8.0",
  "pillow==12.2.0",
  "numpy==2.2.6",
  "psutil==7.0.0",
]

# CUDA 12.8 wheels (Windows and Linux). The PyPI wheel for Windows is CPU-only, so torch must come from this index.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
