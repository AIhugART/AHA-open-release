# The test harness has its OWN environment (plan D13): the gateway never imports `mcp`, and a gateway install never needs it.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aha-open-mcp"
version = "0.1.0.dev0"
description = "MCP server that drives, observes and judges an AHA open server end to end (auto-test and auto-debug)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
  "pyyaml>=6",
  "aha-open",  # contract constants and pure helpers only (plan D6); see [tool.uv.sources]
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aha-open-mcp = "aha_open_mcp.server:main"

[tool.uv.sources]
aha-open = { path = "..", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aha_open_mcp = ["scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
