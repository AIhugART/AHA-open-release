id: real_ref2va_one_image
title: "The real MiniMax H3 reference model makes a 5 s clip from one reference image at the preview size; the downloaded FILE has the accepted picture size, 124 frames at 24 fps, stereo 32 kHz sound and the AI-generated label"
covers: "tests/test_minimax_worker_real.py::test_a_reference_image_job_returns_a_video_of_the_accepted_size_with_sound"
target: sandbox
requires_worker: minimax_h3
preconditions: [real_model_installed]
side_effects: [uploads_file, creates_job, uses_gpu, loads_model]
vars: {prompt: "the red object slowly turns towards the camera, soft light, a quiet room", seed: 42}
steps:
  - tool: run_upload
    args: {synthetic_png: [256, 160], rgb: [220, 30, 30]}
  - tool: run_job
    args: {body: {task: video.generate, model: minimax-h3-ref2va, prompt: "${prompt}", inputs: [{role: reference, upload_id: "${upload_id}"}], params: {seed: "${seed}", short_edge: 352}}}
  # one wait is capped at 600 s by the harness; the reference model has more rows to sample than the text model, so wait twice
  - tool: wait_job
    args: {timeout_s: 600}
  - tool: wait_job
    args: {timeout_s: 600}
  - tool: check_result_video
assert:
  - {path: upload_id, op: exists}
  - {path: submit.http_status, op: eq, value: 202}
  - {path: job.status, op: eq, value: succeeded}
  - {path: "job.results[0].kind", op: eq, value: video}
  - {path: "job.results[0].width", op: eq, value: 608}
  - {path: "job.results[0].height", op: eq, value: 352}
  - {path: video.parsed, op: eq, value: true}
  - {path: video.width, op: eq, value: 608}
  - {path: video.height, op: eq, value: 352}
  - {path: video.frames, op: eq, value: 124}
  - {path: video.fps, op: eq, value: 24.0}
  - {path: video.audio_channels, op: eq, value: 2}
  - {path: video.audio_sample_rate, op: eq, value: 32000}
  - {path: video.comment, op: eq, value: "AI-generated (MiniMax H3)"}
  - {path: video.size_matches, op: eq, value: true}
  - {path: video.fps_matches, op: eq, value: true}
  - {path: video.duration_matches, op: eq, value: true}
  - {path: video.audio_matches, op: eq, value: true}
  - {path: video.sha256_matches, op: eq, value: true}
  - {path: video.bytes_match, op: eq, value: true}
