id: cancel_running_video
title: "A video job that is cancelled while it runs ends cancelled and never has a result (and the file check says there is nothing to fetch)"
covers: "conformance/test_v1_core.py::test_cancel_queued_and_running_and_never_a_result"
target: sandbox
requires_worker: fake
preconditions: [fake_worker_markers, sized_video_sandbox]
side_effects: [creates_job, cancels_job]
vars: {prompt: "p __slow"}
steps:
  - tool: run_job
    args: {body: {task: video.generate, model: example-video-sized, prompt: "${prompt}", params: {seed: 1, short_edge: 32}}}
  - tool: wait_job
    args: {until: [running], timeout_s: 30}
  - tool: run_cancel
  - tool: check_result_video
assert:
  - {path: submit.http_status, op: eq, value: 202}
  - {path: job.status, op: eq, value: cancelled}
  - {path: job.results, op: len_eq, value: 0}
  - {path: video.fetched, op: eq, value: false}
  - {path: video.http_status, op: eq, value: 409}
